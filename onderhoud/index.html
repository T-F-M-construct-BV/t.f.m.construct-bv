<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tijdelijk offline | T.F.M. Construct BV</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    @font-face{font-family:'Bebas Neue';font-weight:400;font-display:swap;src:url('/fonts/bebas-neue-400.woff2') format('woff2')}
    @font-face{font-family:'Inter';font-weight:400 600;font-display:swap;src:url('/fonts/inter-var.woff2') format('woff2')}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#021830;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;line-height:1.6}
    main{max-width:560px;width:100%;text-align:center}
    .logo{display:inline-block;background:#fff;border-radius:10px;padding:10px 16px;margin-bottom:2rem}
    .logo img{display:block;height:56px;width:auto}
    h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(2.2rem,8vw,3.2rem);letter-spacing:.03em;line-height:1.1;margin-bottom:.75rem}
    .line{width:56px;height:4px;background:#E8A500;border-radius:2px;margin:0 auto 1.25rem}
    p{color:rgba(255,255,255,.82);margin-bottom:.5rem}
    .fr{margin-top:1.75rem;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,.12)}
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="/logo.webp" alt="T.F.M. Construct BV" width="160" height="90"></div>

    <h1>Website tijdelijk offline</h1>
    <div class="line"></div>
    <p>Onze website is even niet beschikbaar. We zijn snel terug.</p>

    <div class="fr" lang="fr">
      <h1>Site temporairement indisponible</h1>
      <p>Notre site est momentanément hors ligne. Nous revenons très vite.</p>
    </div>
  </main>
</body>
</html>
